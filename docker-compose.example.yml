# Example deployment with Proton Mail Bridge.
#
# Prerequisites (one-time, interactive):
#   docker compose -f docker-compose.example.yml run --rm -it protonbridge init
#   -> login, then in the Bridge CLI:
#      change imap-security   (answer yes: switch STARTTLS -> SSL)
#      cert export            (path: /root/exported-certs)
#      info                   (note the IMAP username + bridge password)
# Put the bridge credentials into the mailcleaner UI (settings) or the
# environment below, then: docker compose -f docker-compose.example.yml up -d
#
# SECURITY: mailcleaner has no authentication. Bind it to localhost (below)
# or put it behind a reverse proxy with an auth middleware.

services:
  protonbridge:
    # No official image: build one from Proton's source, e.g.
    # https://github.com/mk1337/protonmail-bridge-docker-arm64 (ARM64)
    # or shenxn/protonmail-bridge (x86_64, verify it is maintained).
    image: protonmail-bridge:local
    container_name: protonbridge
    restart: unless-stopped
    volumes:
      - protonbridge_data:/root

  mailcleaner:
    image: ghcr.io/OWNER/proton-mail-cleaner:latest   # or build: .
    container_name: mailcleaner
    restart: unless-stopped
    # Shares the bridge's network namespace so 127.0.0.1 matches the SAN of
    # the bridge's self-signed TLS certificate.
    network_mode: service:protonbridge
    depends_on:
      - protonbridge
    environment:
      IMAP_HOST: 127.0.0.1
      IMAP_PORT: 1143
      SMTP_PORT: 1025
      # IMAP_USER / IMAP_PASSWORD can be set here or in the settings UI.
    volumes:
      - mailcleaner_data:/data
      - type: volume
        source: protonbridge_data
        target: /certs/bridge-cert.pem
        read_only: true
        volume:
          subpath: exported-certs/cert.pem

  # The UI port must be published on the BRIDGE service (shared namespace).
  # Add to protonbridge:  ports: ["127.0.0.1:8765:8765"]

volumes:
  protonbridge_data:
  mailcleaner_data:
