# Mailbroom starter - any IMAP provider (Gmail, iCloud, Fastmail, …).
#
#   cp .env.example .env    # edit it
#   docker compose up -d    # open http://localhost:8765
#
# For Proton Mail via the Bridge use docker-compose.proton.yml instead.

services:
  mailbroom:
    image: ghcr.io/mclgoerg/mailbroom:latest
    container_name: mailbroom
    restart: unless-stopped
    ports:
      # Localhost only by default - override MAILBROOM_BIND in .env (to
      # e.g. 0.0.0.0) only once you enabled AUTH_MODE or run a reverse
      # proxy with its own auth in front. Docker ports bypass ufw!
      - "${MAILBROOM_BIND:-127.0.0.1}:${MAILBROOM_PORT:-8765}:8765"
    env_file: .env
    volumes:
      - mailbroom_data:/data

volumes:
  mailbroom_data:
