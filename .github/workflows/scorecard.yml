name: Scorecard analysis

# Public supply-chain risk score (branch protection, pinned deps, CI
# hardening, ...). Informational only - no PR gate. Published to the
# public Scorecard dashboard/badge only; deliberately NOT uploaded to
# this repo's code-scanning alerts (several checks - Code-Review,
# Maintained, Fuzzing, CII-Best-Practices, Contributors - can never
# clear for a solo-maintained project and would sit there permanently,
# drowning out actual CodeQL findings).
on:
  branch_protection_rule:
  schedule:
    - cron: "12 3 * * 6"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # signs the published result for authenticity
      contents: read
      actions: read      # lets the CI-Tests check read workflow history
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.4.4
        with:
          # The action requires a local results file even when only
          # publishing - it is never uploaded or persisted anywhere.
          results_file: results.sarif
          results_format: sarif
          publish_results: true
