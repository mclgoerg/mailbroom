name: Demo bundle

# Builds the static file set the in-browser demo loads (scripts/demo-bundle/)
# when a PR touches anything that goes into it, enforces the size budget,
# proves the build is reproducible and that the bundle boots in Pyodide.
# The result is an artifact only - nothing is deployed from here.

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/conftest.py"
      - "scripts/demo.py"
      - "scripts/demo_*.py"
      - "scripts/demo-bundle/**"
      - "version.txt"
      - ".github/workflows/demo-bundle.yml"

permissions:
  contents: read

concurrency:
  group: demo-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Install
        run: |
          pip install --require-hashes -r backend/requirements.txt
          npm ci --no-audit --no-fund --prefix scripts/demo-bundle

      # Fails above the size budget (10 MB on the wire) and prints the
      # per-file breakdown either way.
      - name: Build the bundle
        run: node scripts/demo-bundle/build.mjs --out demo-bundle

      - name: The build is reproducible
        run: |
          node scripts/demo-bundle/build.mjs --out demo-bundle-again > /dev/null
          diff -r demo-bundle demo-bundle-again

      - name: The bundle boots and serves
        run: node scripts/demo-bundle/smoke.mjs demo-bundle

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-bundle
          path: demo-bundle
          retention-days: 14
