name: Release Please

# Keeps a single standing "release PR" up to date on every push to main
# (version bump in version.txt, mirrored into frontend/package.json;
# CHANGELOG.md entry) computed from Conventional Commit PR titles since
# the last release - this job itself never tags or publishes anything.
# A release only happens when a human deliberately merges that PR; this
# workflow then detects the merge and builds the versioned image.
#
# Versioned at the repo root (not frontend/), deliberately: Mailbroom
# ships backend + frontend as one container under one version, so EVERY
# commit must count, not just ones touching frontend/ - release-please
# only considers commits that touch a package's own path.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commits/tags the release, via the release PR
      pull-requests: write   # opens/updates the standing release PR
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release

  # release-please tags + creates the GitHub Release itself via the API
  # using GITHUB_TOKEN - and a GITHUB_TOKEN-authored push/release never
  # triggers OTHER workflows (a GitHub Actions limitation), so ci.yml's
  # own tag-triggered build never fires for it. Build the versioned image
  # directly here instead. ci.yml's :latest tag was already rebuilt
  # moments ago by the normal push-to-main build on this same commit -
  # only the version-specific tags are missing.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
