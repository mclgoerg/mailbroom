name: Security scan

# On-demand (Actions tab -> Security scan -> Run workflow) and every
# Monday morning. Three independent angles:
#   secrets      - gitleaks over the FULL git history
#   dependencies - pip-audit (resolved Python deps) + npm audit
#   image        - Trivy CVE scan of the published container image
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0            # gitleaks walks every commit
      # Pinned by digest (v8.30.1) so a moved tag cannot change what runs
      # here. To bump: `docker pull zricethezav/gitleaks:latest`, copy its
      # digest below and the version above. Dependabot does not read
      # `docker run` lines in workflows.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact -v

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: pip-audit (the locked versions the image and CI install)
        run: |
          pip install -q pip-audit
          pip-audit -r backend/requirements.txt \
                    -r backend/requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: npm audit (fail on high+)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Trivy scan of the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true      # only CVEs a rebuild could fix
          exit-code: "1"
