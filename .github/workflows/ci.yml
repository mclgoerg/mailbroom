name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; each job elevates only the permission it
# actually needs (least privilege, and keeps OpenSSF Scorecard's
# Token-Permissions check from flagging a workflow-wide write grant).
permissions:
  contents: read

# One run per ref: a newer push to main (or to a PR branch) cancels the
# in-progress run of the older commit. Prevents N parallel runs after a
# dependabot merge train AND the :latest race where an older run could
# finish last and win the image push. Tags each have their own ref, so
# releases are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs only: flags newly-introduced dependencies with a known
  # vulnerability before merge, complementing Dependabot alerts (which
  # only fire after the fact on main).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # only this job pushes images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Backend tests
        run: |
          pip install -r backend/requirements-dev.txt
          python -m pytest tests/ -q

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Every vX.Y.Z tag becomes a GitHub Release (after tests + the image
  # build succeeded), with auto-generated notes from the merged PRs /
  # commits since the previous tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Mailbroom $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
