name: Validate PR Title

# Squash-merge makes the PR title the commit message, and release-please
# parses that history for Conventional Commit types (feat/fix/...) to
# compute the next version and changelog - an unconventional title would
# silently vanish from both.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
