<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mailbroom</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#a16207" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mailbroom" />
    <!-- This file's content is hashed by GET /api/version (see
         backend/main.py) so an already-open tab can detect a new build. -->
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("pmc_theme") || "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
